<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <title>库存盘点 - LIUBC 同工平台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#111}
    header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
    .container{max-width:1000px;margin:auto;padding:16px}
    .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
    .btn{display:inline-block;margin-top:10px;margin-right:10px;padding:10px 14px;border-radius:12px;background:#2563eb;color:#fff;text-decoration:none}
    .btn2{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:12px;background:#eef2ff;color:#1e40af;text-decoration:none}
    nav a{margin-left:10px;padding:6px 12px;border-radius:16px;background:#eef2ff;color:#1e40af;text-decoration:none}
  </style>
<script>
(function(){
var T=3321102815;
function h(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h1^=h1>>>16;h1=Math.imul(h1,2246822507);h1^=h1>>>13;h2=Math.imul(h2^c,2654435761);h2^=h2>>>16;h2=Math.imul(h2,2246822507);h2^=h2>>>13;}return (h2*2097152+(h1>>>11))>>>0;}
function showLock(){
document.title='Locked';
var css='html,body{height:100%}body{font-family:system-ui,-apple-system,sans-serif;background:#1f2937;color:#f9fafb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.box{background:#374151;border:1px solid #4b5563;padding:36px;border-radius:12px;text-align:center;max-width:320px;width:90%}input{padding:10px;width:100%;box-sizing:border-box;margin:12px 0;border-radius:6px;border:1px solid #4b5563;font-size:16px;background:#fff;color:#111}button{background:#d4a017;color:#111827;border:none;padding:10px 24px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:16px}.err{color:#f87171;font-size:14px;min-height:20px}';
var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
document.body.innerHTML='<div class="box"><h2>🔒 LIUBC \u540c\u5de5\u5e73\u53f0</h2><p style="color:#d1d5db">\u5185\u90e8\u9875\u9762\uff0c\u8bf7\u8f93\u5165\u5bc6\u7801</p><div class="err" id="__e"></div><input type="password" id="__p" placeholder="Password"><br><button id="__b">\u8fdb\u5165</button></div>';
document.documentElement.style.display='';
function go(){var v=document.getElementById('__p').value;if(h(v)===T){try{sessionStorage.setItem('liubc_ok','1');}catch(e){}location.reload();}else{document.getElementById('__e').textContent='Wrong password, try again.';}}
document.getElementById('__b').addEventListener('click',go);
document.getElementById('__p').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
setTimeout(function(){var i=document.getElementById('__p');if(i)i.focus();},50);
}
var ok=false;
try{ok=sessionStorage.getItem('liubc_ok')==='1';}catch(e){}
if(ok)return;
document.documentElement.style.display='none';
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',showLock);}else{showLock();}
})();
</script>
</head>
<body>
<header>
  <div><strong>库存盘点</strong> · LIUBC</div>
  <nav>
    <a href="./index.html">首页</a>
    <a href="./announcements.html">公告</a>

  </nav>
</header>

<div class="container">
  <div class="card">
    <h2>库存盘点（Google Drive / Google 表格）</h2>
    <p>总务/财务可在表格中直接编辑；主席/牧师可查看全表。</p>

    <a id="openInvFolder" class="btn" href="#" target="_blank">打开库存盘点文件夹</a>
    <a id="openInvSheet" class="btn2" href="#" target="_blank">打开盘点表（编辑）</a>

    <p style="margin-top:14px;color:#666;font-size:13px">
      说明：如果需要“网页直接显示表格”，我下一步教你如何在 Google 表格里「发布到网页」并嵌入。
    </p>
  </div>
</div>

<script src="./links.js"></script>
<script>
  document.getElementById("openInvFolder").href = window.LIUBC_LINKS.driveFolders.inventory;
  document.getElementById("openInvSheet").href = window.LIUBC_LINKS.deptDocs.finance; // 这里用 finance 作为盘点表链接（你也可以改成 inventorySheet）
</script>
</body>
</html>
