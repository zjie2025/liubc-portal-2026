<script>
(function(){
var T=3321102815;
function h(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h1^=h1>>>16;h1=Math.imul(h1,2246822507);h1^=h1>>>13;h2=Math.imul(h2^c,2654435761);h2^=h2>>>16;h2=Math.imul(h2,2246822507);h2^=h2>>>13;}return (h2*2097152+(h1>>>11))>>>0;}
window.__liubcGo=function(){
  var v=document.getElementById('__p').value;
  if(h(v)===T){try{sessionStorage.setItem('liubc_ok','1');}catch(e){}location.reload();}
  else{document.getElementById('__e').textContent='\u5bc6\u7801\u4e0d\u5bf9\uff0c\u8bf7\u518d\u8bd5\u4e00\u6b21';}
};
window.__liubcKey=function(ev){if(ev.key==='Enter'){window.__liubcGo();}};
try{if(sessionStorage.getItem('liubc_ok')==='1')return;}catch(e){}
document.open();
